data_dir: data
docs_dir: docs
export:
  dce_timeout: 1200
  batch_size: 500
reddit_global:
  backend: playwright
  headless: true
  # skills_dir defaults to <repo>/scripts (src/collectors/utils.py); set it
  # only to point at a scripts checkout outside the repo.
discord_global:
  bws_secret_id: 70909217-9e02-452b-b933-b45f00c17fee
  dce_bin: /Users/mathias/.hermes/profiles/glenn/home/tools/discordchatexporter/cli/DiscordChatExporter.Cli
clients:
  pure-pool-pro:
    name: Pure Pool Pro
    brand_keywords:
    - pure pool
    - purepoolpro
    - ripstone
