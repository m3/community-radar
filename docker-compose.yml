services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: community_radar
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: community_radar
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://community_radar:password123@db:5432/community_radar
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - REDDIT_SESSION=${REDDIT_SESSION:-}
    # Served by gunicorn, not the Flask dev server. Timeout is generous
    # because several analysis endpoints still scan the full messages table.
    command:
      - gunicorn
      - --bind=0.0.0.0:5001
      - --workers=2
      - --threads=4
      - --timeout=120
      - --access-logfile=-
      - src.dashboard.app:app

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql://community_radar:password123@db:5432/community_radar
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
      - REDDIT_SESSION=${REDDIT_SESSION:-}
    command: ["python", "src/queue_worker.py"]

volumes:
  pgdata:
